[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "qbo-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the QuickBooks Online Accounting API. Read-only customer, vendor, invoice, bill, and chart-of-accounts tools for Claude and other MCP clients."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alvey Automation" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "quickbooks",
    "quickbooks-online",
    "qbo",
    "accounting",
    "claude",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
]

[project.scripts]
qbo-mcp = "qbo_mcp.server:main"

[project.urls]
# Repository URL TBD post-launch — the maintainer creates the GitHub repo
# and updates these links manually before publishing.
Homepage = "https://example.invalid/qbo-mcp"
Repository = "https://example.invalid/qbo-mcp"
Issues = "https://example.invalid/qbo-mcp/issues"
Changelog = "https://example.invalid/qbo-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["qbo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]
